[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thorn"
version = "0.1.0"
description = "THORN — Your Infrastructure Intelligence. Observe. Analyze. Guide. You operate."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Savio Lauf" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # O gateway usa a SDK oficial; import é lazy, então roda sem a key.
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
thorn = "thorn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thorn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
